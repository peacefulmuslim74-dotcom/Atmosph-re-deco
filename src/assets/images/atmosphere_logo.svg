<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Alex+Brush&amp;family=Parisienne&amp;display=swap');
      .logo-text {
        font-family: 'Alex Brush', 'Parisienne', cursive, sans-serif;
        font-size: 82px;
        font-weight: 400;
        fill: #111111;
        text-anchor: middle;
        dominant-baseline: central;
      }
    </style>
  </defs>
  <!-- Brand Circle (Authentic Chartreuse / Olive Green from Atmosphère Décoration Dakar) -->
  <circle cx="250" cy="250" r="235" fill="#9BBA1A" />
  
  <!-- Cursive "Atmosphère" typography -->
  <text x="250" y="254" class="logo-text">Atmosphère</text>
</svg>
